[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vidkit"
version = "0.3.0"
description = "Local-first AI Shorts production pipeline"
requires-python = ">=3.11"
dependencies = ["Pillow>=11.0,<13", "mutagen>=1.47,<2"]

[project.scripts]
vidkit = "vidkit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
