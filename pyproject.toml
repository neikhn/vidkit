[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vidkit"
version = "0.1.0"
description = "Local-first AI Shorts production pipeline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vidkit = "vidkit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
